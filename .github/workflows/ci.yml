name: SupportFlow checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python operations tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lightweight test dependencies
        run: python -m pip install pytest pydantic python-dotenv
      - name: Compile backend
        run: python -m compileall -q src
      - name: Run deterministic unit tests
        run: python -m pytest -q tests/test_ops.py tests/test_signals.py

  frontend:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
